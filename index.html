<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>かわいいタイマー</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 40%, #e1bee7 100%);
      font-family: 'Nunito', sans-serif;
      color: #880e4f;
    }

    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(16px);
      border-radius: 2rem;
      padding: 3rem 3.5rem;
      box-shadow: 0 8px 40px rgba(233, 30, 99, 0.15), 0 2px 8px rgba(233, 30, 99, 0.08);
      border: 1.5px solid rgba(255, 255, 255, 0.8);
    }

    h1 {
      font-family: 'Pacifico', cursive;
      font-size: 2rem;
      color: #e91e8c;
      margin-bottom: 0.3rem;
      text-shadow: 0 2px 8px rgba(233, 30, 99, 0.2);
    }

    .subtitle {
      font-size: 0.85rem;
      color: #f48fb1;
      margin-bottom: 2rem;
      letter-spacing: 0.15em;
    }

    .display-wrap {
      position: relative;
      margin-bottom: 2rem;
    }

    .display {
      font-size: 5.5rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
      color: #c2185b;
      text-shadow: 0 2px 12px rgba(194, 24, 91, 0.2);
      transition: color 0.4s, text-shadow 0.4s;
    }

    .display.running {
      color: #e91e8c;
      text-shadow: 0 0 24px rgba(233, 30, 99, 0.4);
    }

    .display.finished {
      color: #ff4081;
      text-shadow: 0 0 32px rgba(255, 64, 129, 0.6);
      animation: pulse 0.7s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.03); }
    }

    .input-area {
      display: flex;
      gap: 0.4rem;
      justify-content: center;
      align-items: center;
      margin-bottom: 2rem;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
    }

    .input-group label {
      font-size: 0.7rem;
      font-weight: 700;
      color: #f06292;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .input-group input {
      width: 4rem;
      padding: 0.5rem;
      font-size: 1.4rem;
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      text-align: center;
      background: rgba(255, 255, 255, 0.7);
      border: 2px solid #f48fb1;
      border-radius: 12px;
      color: #c2185b;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-group input:focus {
      border-color: #e91e8c;
      box-shadow: 0 0 0 3px rgba(233, 30, 99, 0.15);
    }

    .sep {
      font-size: 2rem;
      font-weight: 700;
      color: #f48fb1;
      padding-bottom: 1.2rem;
    }

    .buttons {
      display: flex;
      gap: 0.8rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      padding: 0.7rem 1.8rem;
      font-size: 0.95rem;
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
      box-shadow: 0 4px 14px rgba(233, 30, 99, 0.2);
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(233, 30, 99, 0.3);
    }

    button:active:not(:disabled) {
      transform: scale(0.96) translateY(0);
    }

    button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    #startBtn {
      background: linear-gradient(135deg, #f06292, #e91e8c);
      color: #fff;
    }

    #pauseBtn {
      background: linear-gradient(135deg, #ce93d8, #ab47bc);
      color: #fff;
    }

    #resetBtn {
      background: rgba(255, 255, 255, 0.7);
      color: #c2185b;
      border: 2px solid #f48fb1;
      box-shadow: none;
    }

    #resetBtn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 4px 14px rgba(233, 30, 99, 0.15);
    }

    .message {
      margin-top: 1.5rem;
      font-size: 1rem;
      font-weight: 700;
      color: #e91e8c;
      min-height: 1.5rem;
      letter-spacing: 0.05em;
    }

    .deco {
      font-size: 1.3rem;
      margin-bottom: 0.1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="deco">🌸</div>
    <h1>Timer</h1>
    <div class="subtitle">cute & fancy</div>

    <div class="display-wrap">
      <div class="display" id="display">00:00:00</div>
    </div>

    <div class="input-area">
      <div class="input-group">
        <label>時間</label>
        <input type="number" id="inputH" min="0" max="99" value="0" />
      </div>
      <span class="sep">:</span>
      <div class="input-group">
        <label>分</label>
        <input type="number" id="inputM" min="0" max="59" value="5" />
      </div>
      <span class="sep">:</span>
      <div class="input-group">
        <label>秒</label>
        <input type="number" id="inputS" min="0" max="59" value="0" />
      </div>
    </div>

    <div class="buttons">
      <button id="startBtn">スタート</button>
      <button id="pauseBtn" disabled>一時停止</button>
      <button id="resetBtn">リセット</button>
    </div>

    <div class="message" id="message"></div>
  </div>

  <script>
    let totalSeconds = 0;
    let remaining = 0;
    let intervalId = null;
    let running = false;

    const display = document.getElementById('display');
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const resetBtn = document.getElementById('resetBtn');
    const message = document.getElementById('message');

    function pad(n) {
      return String(n).padStart(2, '0');
    }

    function updateDisplay(seconds) {
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = seconds % 60;
      display.textContent = `${pad(h)}:${pad(m)}:${pad(s)}`;
    }

    function getInputSeconds() {
      const h = parseInt(document.getElementById('inputH').value) || 0;
      const m = parseInt(document.getElementById('inputM').value) || 0;
      const s = parseInt(document.getElementById('inputS').value) || 0;
      return h * 3600 + m * 60 + s;
    }

    function setInputsDisabled(disabled) {
      ['inputH', 'inputM', 'inputS'].forEach(id => {
        document.getElementById(id).disabled = disabled;
      });
    }

    function finish() {
      running = false;
      clearInterval(intervalId);
      display.classList.remove('running');
      display.classList.add('finished');
      startBtn.disabled = true;
      pauseBtn.disabled = true;
      message.textContent = '時間になりました！';
    }

    startBtn.addEventListener('click', () => {
      if (!running) {
        if (!intervalId) {
          totalSeconds = getInputSeconds();
          if (totalSeconds <= 0) {
            message.textContent = '時間を入力してください';
            return;
          }
          remaining = totalSeconds;
        }
        running = true;
        message.textContent = '';
        display.classList.add('running');
        display.classList.remove('finished');
        setInputsDisabled(true);
        startBtn.disabled = true;
        pauseBtn.disabled = false;

        intervalId = setInterval(() => {
          remaining--;
          updateDisplay(remaining);
          if (remaining <= 0) finish();
        }, 1000);

        updateDisplay(remaining);
      }
    });

    pauseBtn.addEventListener('click', () => {
      if (running) {
        running = false;
        clearInterval(intervalId);
        intervalId = null;
        display.classList.remove('running');
        startBtn.disabled = false;
        pauseBtn.disabled = true;
        message.textContent = '一時停止中';
      }
    });

    resetBtn.addEventListener('click', () => {
      running = false;
      clearInterval(intervalId);
      intervalId = null;
      remaining = 0;
      display.classList.remove('running', 'finished');
      startBtn.disabled = false;
      pauseBtn.disabled = true;
      setInputsDisabled(false);
      message.textContent = '';
      updateDisplay(0);
    });
  </script>
</body>
</html>
